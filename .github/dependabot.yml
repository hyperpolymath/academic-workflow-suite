# Dependabot configuration for Academic Workflow Suite
# Automated dependency updates for security and maintenance

version: 2

multi-ecosystem-groups:
  js-locks:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

updates:
  # Rust dependencies (Cargo)
  - package-ecosystem: "cargo"
    directory: "/components/core"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    reviewers:
      - "academic-workflow-suite/maintainers"
    labels:
      - "dependencies"
      - "rust"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  - package-ecosystem: "cargo"
    directory: "/components/ai-jail"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    reviewers:
      - "academic-workflow-suite/maintainers"
    labels:
      - "dependencies"
      - "rust"
      - "security-critical"
      - "automated"
    commit-message:
      prefix: "chore(deps)"

  # Elixir dependencies (Mix)
  - package-ecosystem: "mix"
    directory: "/components/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    reviewers:
      - "academic-workflow-suite/maintainers"
    labels:
      - "dependencies"
      - "elixir"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  # Node.js dependencies (npm)
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/components/office-addin"
    multi-ecosystem-group: "js-locks"
    patterns: ["*"]
    open-pull-requests-limit: 10
    reviewers:
      - "academic-workflow-suite/maintainers"
    labels:
      - "dependencies"
      - "javascript"
      - "automated"
    versioning-strategy: increase

  # Bun: bun.lock is at the root, so this watches "/". npm also watches "/" (root pnpm-lock.yaml) as well as /components/office-addin
  - package-ecosystem: "bun"
    directory: "/"
    multi-ecosystem-group: "js-locks"
    patterns: ["*"]
    open-pull-requests-limit: 10
    reviewers:
      - "academic-workflow-suite/maintainers"
    labels:
      - "dependencies"
      - "javascript"
      - "automated"
    versioning-strategy: increase

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 3
    reviewers:
      - "academic-workflow-suite/maintainers"
    labels:
      - "dependencies"
      - "ci-cd"
      - "automated"
    commit-message:
      prefix: "chore(ci)"

  # Docker (if Dockerfiles exist)
  - package-ecosystem: "docker"
    directory: "/components/ai-jail"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 3
    reviewers:
      - "academic-workflow-suite/maintainers"
    labels:
      - "dependencies"
      - "docker"
      - "security-critical"
      - "automated"
    commit-message:
      prefix: "chore(docker)"
