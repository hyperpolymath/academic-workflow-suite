# This workflow is managed by gh actions-lock.
name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube
    # Dependabot-authored runs get a secrets-restricted GITHUB_TOKEN and
    # cannot see repo Actions secrets (only the separate Dependabot secrets
    # store, which SONAR_TOKEN isn't in) -- skip rather than fail unwinnably.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
