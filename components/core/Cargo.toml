[package]
name = "aws-core"
version = "0.1.0"
edition = "2021"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
description = "Core engine for TMA marking automation system"
license = "MPL-2.0"

[dependencies]
# Async runtime
tokio = { version = "1.52", features = ["full"] }

# Web frameworks
actix-web = "4.13"
actix-cors = "0.7"
actix-files = "0.7"
async-graphql = "7.0"
async-graphql-actix-web = "7.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Database (event store)
heed = "0.22"  # Modern LMDB wrapper

# Cryptography
sha3 = "0.12"
blake3 = "1.8"
aes-gcm = "0.11"
argon2 = "0.6"

# Document parsing
zip = "8.6"  # For DOCX (Office Open XML)
quick-xml = "0.41"

# Identifiers
uuid = { version = "1.23", features = ["v4", "serde"] }

# Utilities
regex = "1.12"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.11"
futures = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-actix-web = "0.7"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Configuration
config = "0.15"
dotenvy = "0.15"

[dev-dependencies]
tempfile = "3.26"
tokio-test = "0.4"

[lib]
name = "aws_core"
path = "src/lib.rs"

# WASM compatibility considerations
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
